<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 摘要工具 (Vertex AI 版)</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-hover: #2d2d2d;
            --primary-color: #8ab4f8;
            --primary-hover: #aecbfa;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --error-color: #f28b82;
            --border-color: #3c4043;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: var(--text-color);
        }

        .section-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 12px;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--surface-hover);
            border-color: var(--text-secondary);
        }

        .level-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .level-btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .level-btn.active {
            background-color: #1a73e8;
            border-color: #1a73e8;
            color: #ffffff;
        }

        .level-btn .level-num {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .level-btn .level-name {
            font-size: 1rem;
            font-weight: bold;
        }

        .error-box {
            background-color: rgba(242, 139, 130, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            word-break: break-all;
        }

        .result-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            min-height: 100px;
            color: var(--text-color);
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .sheet-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
            word-break: break-all;
        }

        .action-submit {
            background-color: #8ab4f8;
            color: #121212;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-submit:hover {
            opacity: 0.9;
            background-color: #8ab4f8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gemini 摘要 (Vertex AI)</h1>

    <!-- 專案 ID 設定 (對應你截圖中的 device-streaming-b0a9d3b7) -->
    <div>
        <div class="section-label">Google Cloud 專案 ID (Project ID)</div>
        <input type="text" id="projectIdInput" value="device-streaming-b0a9d3b7" placeholder="例如: device-streaming-b0a9d3b7">
    </div>

    <!-- API Key 設定 -->
    <div>
        <div class="section-label">Gemini API Key (已啟用 Vertex API)</div>
        <input type="password" id="apiKeyInput" placeholder="請輸入你在 Google Cloud 產生的 API 金鑰">
    </div>

    <!-- 內容輸入區 -->
    <div>
        <div class="section-label">內容</div>
        <textarea id="contentInput" placeholder="請輸入或貼上要摘要的文字..." oninput="updateCharCount()"></textarea>
        <div class="char-count" id="charCount">0 字</div>
    </div>

    <!-- 剪貼簿與清除按鈕 -->
    <div class="button-group">
        <button onclick="pasteFromClipboard()">貼上剪貼簿</button>
        <button onclick="clearContent()">清除</button>
    </div>

    <!-- 摘要級數選擇 -->
    <div>
        <div class="section-label">選擇摘要級數</div>
        <div class="level-group">
            <div class="level-btn" onclick="setLevel(1, this)">
                <span class="level-num">一級</span>
                <span class="level-name">簡短</span>
            </div>
            <div class="level-btn active" onclick="setLevel(2, this)">
                <span class="level-num">二級</span>
                <span class="level-name">重點</span>
            </div>
            <div class="level-btn" onclick="setLevel(3, this)">
                <span class="level-num">三級</span>
                <span class="level-name">詳細</span>
            </div>
        </div>
    </div>

    <!-- Google Sheet（自動揀最近開啟嘅） -->
    <div>
        <div class="section-label">Google Sheet（摘要自動貼到最近開啟嘅 Sheet A 欄下一行）</div>
        <div class="button-group">
            <button onclick="loginAndFindSheet()">Google 登入</button>
            <button onclick="loginAndFindSheet()">重新搵最近 Sheet</button>
        </div>
        <div class="sheet-info" id="sheetInfo">未登入</div>
    </div>

    <!-- 送出按鈕 -->
    <button class="action-submit" onclick="generateSummary()">開始生成摘要</button>

    <!-- 錯誤訊息框 -->
    <div class="error-box" id="errorBox"></div>

    <!-- 摘要內容顯示區 -->
    <div>
        <div class="section-label">摘要內容</div>
        <div class="result-box" id="resultBox">摘要會顯示喺呢度</div>
    </div>

    <!-- 複製摘要按鈕 -->
    <button onclick="copyResult()">複製摘要</button>
</div>

<script>
    let currentLevel = 2; // 預設為二級

    // ===== Google Sheet 自動貼上 =====
    const CLIENT_ID = '539262270350-359cuo3a7l5onpijsuav4elbchrrfopl.apps.googleusercontent.com';
    const SCOPE = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.metadata.readonly';
    let gToken = null, gTokenExp = 0, tokenClient = null, targetSheet = null;

    function setSheetInfo(msg) {
        document.getElementById('sheetInfo').innerText = msg;
    }

    function getToken() {
        return new Promise((resolve, reject) => {
            if (!tokenClient && window.google && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID, scope: SCOPE, callback: () => {}
                });
            }
            if (!tokenClient) return reject(new Error('Google 登入元件未載入'));
            if (gToken && Date.now() < gTokenExp) return resolve(gToken);
            tokenClient.callback = (r) => {
                if (r.error) return reject(new Error(r.error));
                gToken = r.access_token;
                gTokenExp = Date.now() + (r.expires_in - 60) * 1000;
                resolve(gToken);
            };
            tokenClient.requestAccessToken({ prompt: gToken ? '' : 'consent' });
        });
    }

    async function gFetch(url, opt) {
        const t = await getToken();
        const r = await fetch(url, Object.assign({}, opt, {
            headers: Object.assign({ Authorization: 'Bearer ' + t }, (opt && opt.headers) || {})
        }));
        const j = await r.json();
        if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
        return j;
    }

    async function findRecentSheet() {
        const q = encodeURIComponent("mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
        const j = await gFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=viewedByMeTime%20desc&pageSize=1&fields=files(id,name)');
        if (!j.files || !j.files.length) throw new Error('搵唔到 Google Sheet');
        const f = j.files[0];
        const m = await gFetch('https://sheets.googleapis.com/v4/spreadsheets/' + f.id + '?fields=sheets.properties.title');
        targetSheet = { id: f.id, name: f.name, tab: m.sheets[0].properties.title };
        setSheetInfo('目標：' + targetSheet.name + '（分頁：' + targetSheet.tab + '，A 欄）');
    }

    async function loginAndFindSheet() {
        try {
            setSheetInfo('登入中...');
            await findRecentSheet();
            localStorage.setItem('sheet_enabled', '1');
        } catch (err) {
            setSheetInfo('失敗：' + err.message);
        }
    }

    async function appendToSheet(text) {
        if (!targetSheet) await findRecentSheet();
        const range = encodeURIComponent("'" + targetSheet.tab + "'!A:A");
        await gFetch('https://sheets.googleapis.com/v4/spreadsheets/' + targetSheet.id + '/values/' + range + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: [[text]] })
        });
    }

    // ===== 記住專案 ID / API Key，開頁自動貼上剪貼簿 =====
    window.addEventListener('load', () => {
        const pid = localStorage.getItem('gem_pid');
        const key = localStorage.getItem('gem_key');
        if (pid) document.getElementById('projectIdInput').value = pid;
        if (key) document.getElementById('apiKeyInput').value = key;
        document.getElementById('projectIdInput').addEventListener('input', e => localStorage.setItem('gem_pid', e.target.value.trim()));
        document.getElementById('apiKeyInput').addEventListener('input', e => localStorage.setItem('gem_key', e.target.value.trim()));
        autoPaste();
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) autoPaste(); });

    async function autoPaste() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
                document.getElementById('contentInput').value = text;
                updateCharCount();
            }
        } catch (err) { /* 需要權限或用戶手動按 */ }
    }

    function setLevel(level, element) {
        currentLevel = level;
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    function updateCharCount() {
        const text = document.getElementById('contentInput').value;
        document.getElementById('charCount').innerText = text.length + ' 字';
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('contentInput').value = text;
            updateCharCount();
        } catch (err) {
            alert('無法讀取剪貼簿，請手動貼上。');
        }
    }

    function clearContent() {
        document.getElementById('contentInput').value = '';
        updateCharCount();
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('errorBox').innerText = '';
        document.getElementById('resultBox').innerText = '摘要會顯示喺呢度';
    }

    function showError(message) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = message;
        errorBox.style.display = 'block';
    }

    async function generateSummary() {
        const projectId = document.getElementById('projectIdInput').value.trim();
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const content = document.getElementById('contentInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const errorBox = document.getElementById('errorBox');

        errorBox.style.display = 'none';
        errorBox.innerText = '';

        if (!projectId || !apiKey) {
            showError('請填寫 Google Cloud 專案 ID 以及對應的 API 金鑰。');
            return;
        }

        if (!content) {
            alert('請先輸入需要摘要的內容！');
            return;
        }

        // 先攞 Google token（要喺點擊動作內），失敗都照樣生成摘要
        let sheetOk = true;
        if (localStorage.getItem('sheet_enabled') === '1') {
            try { await getToken(); } catch (err) { sheetOk = false; setSheetInfo('Google 登入失敗，摘要只會複製到剪貼簿'); }
        } else {
            sheetOk = false;
            setSheetInfo('未登入 Google（按上面「Google 登入」先會貼 Sheet），摘要只會複製到剪貼簿');
        }

        resultBox.innerText = '正在透過 Vertex AI 生成摘要，請稍候...';

        let promptInstruction = '';
        if (currentLevel === 1) {
            promptInstruction = '請用極為簡短的一句話或段落總結以下內容：\n\n';
        } else if (currentLevel === 2) {
            promptInstruction = '請以重點條列方式總結以下內容：\n\n';
        } else {
            promptInstruction = '請提供詳細且結構清晰的摘要，包含背景與細節：\n\n';
        }

        // 使用 Vertex AI REST API 端點（以 us-central1 區域為例）
        const region = 'global';
        const model = 'gemini-3.8-flash';
        const host = region === 'global' ? 'aiplatform.googleapis.com' : `${region}-aiplatform.googleapis.com`;
        const url = `https://${host}/v1/projects/${projectId}/locations/${region}/publishers/google/models/${model}:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        role: 'user',
                        parts: [{ text: promptInstruction + content }]
                    }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `API Error: ${response.status}`);
            }

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const summaryText = data.candidates[0].content.parts[0].text;
                resultBox.innerText = summaryText;
                let pasted = false;
                if (sheetOk) {
                    try {
                        await appendToSheet(summaryText);
                        pasted = true;
                        setSheetInfo('✅ 已貼到「' + targetSheet.name + '」（分頁：' + targetSheet.tab + '）A 欄下一行');
                    } catch (e2) {
                        showError('摘要完成，但貼到 Sheet 失敗：' + e2.message);
                    }
                }
                if (!pasted) {
                    try { await navigator.clipboard.writeText(summaryText); setSheetInfo(document.getElementById('sheetInfo').innerText + '\n（已改為複製到剪貼簿）'); } catch (e3) {}
                }
            } else {
                throw new Error('無法解析 Vertex AI 回傳的內容。');
            }

        } catch (err) {
            resultBox.innerText = '生成失敗。';
            showError(`出錯：[Vertex AI] ${err.message}`);
        }
    }

    async function copyResult() {
        const text = document.getElementById('resultBox').innerText;
        if (!text || text === '摘要會顯示喺呢度') {
            alert('沒有可複製的摘要內容！');
            return;
        }
        try {
            await navigator.clipboard.writeText(text);
            alert('摘要已成功複製到剪貼簿！');
        } catch (err) {
            alert('複製失敗。');
        }
    }
</script>

</body>
</html>
